name: Claude Auto Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  auto-review:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write # インラインレビューコメントを投稿するために write が必要
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1

      - name: Automatic PR Review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          timeout_minutes: "10"
          direct_prompt: |
            このプルリクエストをレビューし、プロジェクトの規約に沿った包括的なフィードバックを提供してください。

            ## プロジェクト構成
            - `typescript/` : フロントエンド。Next.js (App Router) + TailwindCSS。
              パッケージマネージャは pnpm。アーキテクチャは FSD (Feature-Sliced Design) を採用し、
              ESLint で層の依存ルールを強制、Prettier で整形している。
            - `go/` : バックエンド。Go 標準ライブラリ (net/http) を使用。
              Clean Architecture を採用（依存の向きは内側へ: infrastructure → handler → usecase → domain。
              domain は何にも依存しない）。
            - `db/` : PostgreSQL。

            変更ディレクトリに CLAUDE.md がある場合は必ず参照し、そのプロジェクト固有の規約に従ってください。

            ## 共通の観点
            - コード品質とベストプラクティス
            - 潜在的なバグや不具合
            - パフォーマンス
            - セキュリティ（認証・入力バリデーション・SQLインジェクション・機密情報の漏洩など）
            - テストの網羅性
            - 必要に応じたドキュメント更新

            ## フロントエンド (`typescript/`) の観点
            - FSD の層構造と依存方向の遵守（上位層から下位層への一方向依存になっているか）
            - Next.js App Router の適切な利用（Server / Client Components の使い分け、データ取得）
            - TailwindCSS の一貫した使い方
            - 型安全性（any の乱用がないか、適切な型付けがされているか）

            ## バックエンド (`go/`) の観点
            - Clean Architecture の依存方向の遵守（domain が外側を import していないか、
              usecase が具象ではなく interface に依存しているか）
            - エラーハンドリングの適切さ（error の握りつぶしがないか）
            - net/http の適切な利用、goroutine のリークや競合状態の有無

            ## QA項目のレビュー
            プルリクエスト説明の末尾に「dev環境でのQA項目」がある場合:
            - QAチェックリストが網羅的で必要なテストシナリオを尽くしているか確認する
            - 変更内容から見て抜けている重要なテストケースがないか確認する
            - 重要な機能がカバーされていなければ追加のQA項目を提案する

            改善のための具体的な提案を添えて、建設的なフィードバックを行ってください。
            指摘箇所はインラインコメントで示してください。
            提供された情報が他言語であっても、必ず日本語で回答してください。
          allowed_tools: "mcp__github__create_pending_pull_request_review,mcp__github__add_pull_request_review_comment_to_pending_review,mcp__github__submit_pending_pull_request_review,mcp__github__get_pull_request_diff"
