services:
  db:
    image: transcendence-db
    container_name: postgres
    build:
      context: ./db/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-transcendence}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transcendence-network

  atlas-dev:
    image: postgres:16-alpine
    container_name: atlas-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atlas_dev
    ports:
      - "5433:5432"
    volumes:
      - ./backend/migrations/20260803000000_enable_citext.sql:/docker-entrypoint-initdb.d/01_citext.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transcendence-network

  backend:
    image: transcendence-backend
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      # コンテナ内から見た DB のアドレス。ホスト名は localhost ではなく db。
      # ルートの .env にある DATABASE_URL は「ホストから atlas / make が使う」用途で
      # localhost:5432 を指しているため、ここでは展開しない（展開すると自分自身を指してしまう）。
      DATABASE_URL: postgresql://postgres:postgres@db:5432/transcendence
      # TLSの要否は接続文字列に混ぜず、この変数で切り替える。
      PGSSLMODE: ${PGSSLMODE:-disable}
      # Google OAuth。未設定だと起動時に落ちる（.env に入れる）。
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Google Cloud Console に登録した値と完全一致させる必要がある。
      # ブラウザがアクセスする URL なので db や backend ではなく localhost。
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-https://localhost:8443/auth/google/callback}
      # ログイン後の戻り先。
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # アップロードされたアバター画像。bind mount の外に置いて repo を汚さない。
      - media_data:/app/uploads
    networks:
      - transcendence-network

  frontend:
    image: transcendence-frontend
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # クライアントサイド（ブラウザ）からのアクセス用
      # ブラウザから実行されるため、localhost を使用
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost:8443}
      # Server Component から呼ぶとき用。コンテナ内では localhost は
      # frontend 自身を指すので、サービス名で backend を呼ぶ。
      API_URL: http://backend:4000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - transcendence-network

  # ブラウザからの HTTPS / WSS の入口。証明書はローカル CA の自己署名。
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "443:443"   # https://localhost      -> frontend
      - "8443:8443" # https://localhost:8443 -> backend (API / WSS)
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend
      - backend
    networks:
      - transcendence-network

networks:
  transcendence-network:
    name: transcendence-network
    driver: bridge

volumes:
  postgres_data:
    name: postgres_data
  caddy_data:
    name: caddy_data
  media_data:
    name: media_data