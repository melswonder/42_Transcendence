      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apispec.TokenResponse'
        "400":
          description: code / state が不正
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "409":
          description: 同じプロバイダアカウントが別ユーザーに紐づいている
