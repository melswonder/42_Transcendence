          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 対戦履歴
      tags:
      - matches
    post:
      consumes:
      - application/json
      description: |-
        ゲーム側が決着時に呼ぶ入口。レーティング・XP・レベルの更新と実績の判定を行い、
        参加者に対して SSE で更新を通知する。
      parameters:
      - description: 決着した対戦
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/apispec.MatchCreateRequest'
