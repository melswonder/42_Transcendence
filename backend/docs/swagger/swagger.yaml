        name: outcome
        type: string
      - default: 20
        description: 取得件数 (1-100)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: 取得開始位置
        in: query
        minimum: 0
        name: offset
        type: integer
