      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apispec.MatchListResponse'
        "400":
          description: from > to、または範囲外の値
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
