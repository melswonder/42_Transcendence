      tags:
      - auth
  /auth/oauth/accounts/{accountId}:
    delete:
      description: 解除するとログイン手段が無くなる場合（パスワード未設定で連携が 1 件だけ）は 409 を返す。
      parameters:
      - description: oauth_accounts の ID
        format: uuid
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 解除完了
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "404":
          description: Not Found
