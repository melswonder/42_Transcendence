basePath: /api/v1
definitions:
  apispec.APIKeyCreateRequest:
    properties:
      expires_at:
        description: 省略で無期限
        type: string
      name:
        example: my analytics bot
        type: string
      scopes:
        description: read / write
        example:
        - read
        items:
          type: string
        type: array
    required:
    - name
    - scopes
    type: object
  apispec.APIKeyCreatedResponse:
    properties:
      api_key:
        example: tsc_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        type: string
      key:
        $ref: '#/definitions/apispec.APIKeyResponse'
    type: object
  apispec.APIKeyListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/apispec.APIKeyResponse'
        type: array
    type: object
  apispec.APIKeyResponse:
    properties:
      created_at:
        type: string
      expires_at:
        description: null なら無期限
        type: string
      id:
        format: uuid
        type: string
      key_prefix:
        description: どのキーか見分ける用。認証には使えない
        example: tsc_a1b2c3
        type: string
      last_used_at:
        type: string
      name:
        example: my analytics bot
        type: string
      revoked_at:
        type: string
      scopes:
        description: read / write
        example:
        - read
        - write
        items:
          type: string
        type: array
    type: object
  apispec.Achievement:
    properties:
      category:
        enum:
        - wins
        - streak
        - matches
        - rating
        example: wins
        type: string
      code:
        example: first_win
        type: string
      description:
        example: はじめて対戦に勝つ
        type: string
      name:
        example: 初勝利
        type: string
      progress:
        description: Progress / Target は未解除の実績でも「10 戦中 7 戦」を出せるように常に入れる。
        example: 7
        type: integer
      target:
        example: 10
        type: integer
      unlocked:
        example: false
        type: boolean
      unlocked_at:
        description: 未解除なら null
        type: string
    type: object
  apispec.AchievementListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/apispec.Achievement'
        type: array
      total_count:
        example: 12
        type: integer
      unlocked_count:
        example: 4
        type: integer
    type: object
  apispec.BlockCreateRequest:
    properties:
      user_id:
        example: 3f0c1a2e-9a5b-4c7d-8e1f-2b3c4d5e6f70
        format: uuid
        type: string
    required:
    - user_id
    type: object
  apispec.BlockListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/apispec.BlockResponse'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        description: 条件に合致する総件数
        example: 128
        type: integer
    type: object
  apispec.BlockResponse:
    properties:
      created_at:
        type: string
      id:
        format: uuid
        type: string
      user:
        allOf:
        - $ref: '#/definitions/apispec.UserPublic'
        description: ブロックされている側
    type: object
  apispec.BreakdownResponse:
    properties:
      by_mode:
        items:
          $ref: '#/definitions/apispec.BreakdownSlice'
        type: array
      by_outcome:
        items:
          $ref: '#/definitions/apispec.BreakdownSlice'
        type: array
      by_result_type:
        items:
          $ref: '#/definitions/apispec.BreakdownSlice'
        type: array
    type: object
  apispec.BreakdownSlice:
    properties:
      count:
        example: 28
        type: integer
      key:
        example: goal
        type: string
    type: object
  apispec.DeleteMeRequest:
    properties:
      password:
        example: correct horse battery staple
        type: string
    type: object
  apispec.ErrorResponse:
    properties:
      code:
        example: unauthorized
        type: string
      message:
        example: 認証が必要です
        type: string
    type: object
  apispec.FriendRequestCreateRequest:
    properties:
      user_id:
        example: 3f0c1a2e-9a5b-4c7d-8e1f-2b3c4d5e6f70
        format: uuid
        type: string
    required:
    - user_id
    type: object
  apispec.FriendRequestDecisionRequest:
    properties:
      action:
        enum:
        - accept
        - reject
        example: accept
        type: string
    required:
    - action
    type: object
  apispec.FriendshipListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/apispec.FriendshipResponse'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        description: 条件に合致する総件数
        example: 128
        type: integer
    type: object
  apispec.FriendshipResponse:
    properties:
      created_at:
        type: string
      requested_by_me:
        description: requested_by_user_id が自分か
        example: true
        type: boolean
      status:
        enum:
        - pending
        - accepted
        - rejected
        example: accepted
        type: string
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/apispec.UserPublic'
        description: 相手
    type: object
  apispec.LeaderboardEntry:
    properties:
      losses:
        example: 40
        type: integer
      rank:
        description: 同率は同順位（1,1,3 の付き方）
        example: 1
        type: integer
      rating:
        example: 1830
        type: integer
      user:
        $ref: '#/definitions/apispec.UserPublic'
      win_rate:
        example: 0.75
        type: number
      wins:
        example: 120
        type: integer
    type: object
  apispec.LeaderboardResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/apispec.LeaderboardEntry'
        type: array
      limit:
        example: 20
        type: integer
      me:
        allOf:
        - $ref: '#/definitions/apispec.LeaderboardEntry'
        description: |-
          Me は自分が表示範囲の外にいても順位を出せるように別枠で返す。
          未対戦などで順位が付かない場合は null。
      offset:
        example: 0
        type: integer
      total:
        description: 条件に合致する総件数
        example: 128
        type: integer
    type: object
  apispec.LoginRequest:
    properties:
      email:
        example: user@example.com
        format: email
        type: string
      password:
        example: correct horse battery staple
        type: string
    required:
    - email
    - password
    type: object
  apispec.MatchCreateRequest:
    properties:
      finished_at:
        type: string
      mode:
        enum:
        - ranked
        - casual
        - ai
        - friend
        example: ranked
        type: string
      participants:
        description: ちょうど 2 件
        items:
          $ref: '#/definitions/apispec.MatchParticipantInput'
        type: array
      result_type:
        enum:
        - goal
        - resign
        - timeout
        - draw
        - abort
        example: goal
        type: string
      started_at:
        type: string
      total_moves:
        example: 42
        minimum: 0
        type: integer
    required:
    - finished_at
    - mode
    - participants
    - result_type
    - started_at
    type: object
  apispec.MatchListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/apispec.MatchResponse'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        description: 条件に合致する総件数
        example: 128
        type: integer
    type: object
  apispec.MatchParticipantInput:
    properties:
      outcome:
        enum:
        - win
        - loss
        - draw
        example: win
        type: string
      seat:
        description: 0=先手 1=後手
        enum:
        - 0
        - 1
        example: 0
        type: integer
      user_id:
        example: 3f0c1a2e-9a5b-4c7d-8e1f-2b3c4d5e6f70
        format: uuid
        type: string
    required:
    - outcome
    - seat
    - user_id
    type: object
  apispec.MatchResponse:
    properties:
      finished_at:
        type: string
      id:
        format: uuid
        type: string
      mode:
        enum:
        - ranked
        - casual
        - ai
        - friend
        example: ranked
        type: string
      opponent:
        allOf:
        - $ref: '#/definitions/apispec.UserPublic'
        description: AI 戦では handle が "bot" のダミーを返す
      outcome:
        description: 自分から見た勝敗
        enum:
        - win
        - loss
        - draw
        example: win
        type: string
      rating_after:
        example: 1444
        type: integer
      rating_before:
        example: 1432
        type: integer
      rating_diff:
        description: rating_after - rating_before。クライアントで引き算させない
        example: 12
        type: integer
      result_type:
        description: 決着のつき方
        enum:
        - goal
        - resign
        - timeout
        - draw
        - abort
        example: goal
        type: string
      started_at:
        type: string
      total_moves:
        example: 42
        type: integer
      xp_gained:
        example: 50
        type: integer
    type: object
  apispec.MediaAssetListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/apispec.MediaAssetResponse'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        description: 条件に合致する総件数
        example: 128
        type: integer
    type: object
  apispec.MediaAssetResponse:
    properties:
      checksum_sha256:
        example: 9f2b7c1e4a5d6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8
        type: string
      created_at:
        type: string
      height:
        example: 512
        type: integer
      id:
        format: uuid
        type: string
      mime_type:
        enum:
        - image/png
        - image/jpeg
        - image/webp
        example: image/png
        type: string
      original_filename:
        example: icon.png
        type: string
      purpose:
        enum:
        - avatar
        example: avatar
        type: string
      size_bytes:
        example: 48219
        type: integer
      status:
        enum:
        - active
        - deleted
        example: active
        type: string
      url:
        example: https://cdn.example.com/avatars/9b7f2c11.png
        type: string
      width:
        example: 512
        type: integer
    type: object
  apispec.OAuthAccountListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/apispec.OAuthAccountResponse'
        type: array
    type: object
  apispec.OAuthAccountResponse:
    properties:
      created_at:
        type: string
      id:
        format: uuid
        type: string
      provider:
        enum:
        - google
        - github
        - "42"
        example: google
        type: string
      provider_account_id:
        example: "117452839201847362514"
        type: string
      provider_email:
        example: user@gmail.com
        format: email
        type: string
    type: object
  apispec.OAuthAuthorizeResponse:
    properties:
      authorization_url:
        example: https://accounts.google.com/o/oauth2/v2/auth?...
        type: string
      state:
        example: 9f8e7d6c5b4a
        type: string
    type: object
  apispec.PublicProfileUpdateRequest:
    properties:
      display_name:
        example: Alice
        type: string
      handle:
        example: alice_42
        type: string
      preferred_locale:
        enum:
        - ja
        - en
        - fr
        type: string
    type: object
  apispec.RegisterRequest:
    properties:
      display_name:
        example: melswonder
        maxLength: 50
        type: string
      email:
        example: user@example.com
        format: email
        type: string
      handle:
        example: mels
        maxLength: 30
        type: string
      password:
        example: correct horse battery staple
        minLength: 8
        type: string
      preferred_locale:
        enum:
        - ja
        - en
        - fr
        example: ja
        type: string
    required:
    - display_name
    - email
    - handle
    - password
    type: object
  apispec.SessionListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/apispec.SessionResponse'
        type: array
    type: object
  apispec.SessionResponse:
    properties:
      created_at:
        type: string
      current:
        description: このリクエストに使われているセッションか
        example: true
        type: boolean
      expires_at:
        type: string
      id:
        example: c1a2b3d4-5e6f-4071-8293-a4b5c6d7e8f9
        format: uuid
        type: string
      last_seen_at:
        type: string
    type: object
  apispec.StatsSummary:
    properties:
      best_streak:
        example: 7
        type: integer
      current_streak:
        description: 連勝は正、連敗は負
        example: 3
        type: integer
      draws:
        example: 3
        type: integer
      level:
        example: 7
        type: integer
      losses:
        example: 18
        type: integer
      ranking:
        description: rating の降順順位。同率は同順位
        example: 12
        type: integer
      rating:
        example: 1444
        type: integer
      total_matches:
        example: 63
        type: integer
      total_players:
        description: 「250 人中 12 位」を作るため
        example: 250
        type: integer
      win_rate:
        description: 0.0-1.0。引き分けは母数に含む
        example: 0.667
        type: number
      wins:
        example: 42
        type: integer
      xp:
        example: 1420
        type: integer
      xp_for_next_level:
        description: このレベルの上限。進捗バーの分母
        example: 1600
        type: integer
    type: object
  apispec.StatsUpdatedEvent:
    properties:
      match_id:
        format: uuid
        type: string
      occurred_at:
        type: string
      outcome:
        enum:
        - win
        - loss
        - draw
        type: string
      rating:
        example: 1444
        type: integer
    type: object
  apispec.TimeseriesPoint:
    properties:
      date:
        description: interval=week のときは週の開始日
        example: "2026-08-20"
        type: string
      draws:
        example: 0
        type: integer
      losses:
        example: 1
        type: integer
      matches:
        example: 4
        type: integer
      rating:
        description: そのコマの最後の対戦後のレーティング
        example: 1444
        type: integer
      wins:
        example: 3
        type: integer
    type: object
  apispec.TimeseriesResponse:
    properties:
      interval:
        enum:
        - day
        - week
        example: day
        type: string
      points:
        items:
          $ref: '#/definitions/apispec.TimeseriesPoint'
        type: array
    type: object
  apispec.TokenResponse:
    properties:
      access_token:
        example: v1.f7a1c0b9d2e34f56a7b8c9d0e1f23456
        type: string
      expires_at:
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/apispec.UserPrivate'
    type: object
  apispec.UpdateMeRequest:
    properties:
      avatar_asset_id:
        description: null を渡すとアバターを外す
        example: 9b7f2c11-33aa-4d0e-9f21-77c1b0a5e123
        format: uuid
        type: string
      display_name:
        example: melswonder
        type: string
      handle:
        example: mels
        type: string
      preferred_locale:
        enum:
        - ja
        - en
        - fr
        example: ja
        type: string
    type: object
  apispec.UserListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/apispec.UserPublic'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        description: 条件に合致する総件数
        example: 128
        type: integer
    type: object
  apispec.UserPrivate:
    properties:
      avatar_url:
        description: 未設定ならデフォルト画像の URL
        example: https://cdn.example.com/avatars/default.png
        type: string
      created_at:
        type: string
      display_name:
        example: melswonder
        type: string
      email:
        example: user@example.com
        format: email
        type: string
      experience_points:
        example: 1420
        type: integer
      handle:
        example: mels
        type: string
      has_password:
        description: password_hash の有無だけを公開する
        example: true
        type: boolean
      id:
        example: 3f0c1a2e-9a5b-4c7d-8e1f-2b3c4d5e6f70
        format: uuid
        type: string
      level:
        example: 7
        type: integer
      linked_providers:
        description: oauth_accounts から導出
        example:
        - google
        - "42"
        items:
          type: string
        type: array
      preferred_locale:
        example: ja
        type: string
      status:
        enum:
        - active
        - suspended
        - deleted
        example: active
        type: string
      updated_at:
        type: string
    type: object
  apispec.UserPublic:
    properties:
      avatar_url:
        description: 未設定ならデフォルト画像の URL
        example: https://cdn.example.com/avatars/default.png
        type: string
      created_at:
        type: string
      display_name:
        example: melswonder
        type: string
      experience_points:
        example: 1420
        type: integer
      handle:
        example: mels
        type: string
      id:
        example: 3f0c1a2e-9a5b-4c7d-8e1f-2b3c4d5e6f70
        format: uuid
        type: string
      level:
        example: 7
        type: integer
      status:
        enum:
        - active
        - suspended
        - deleted
        example: active
        type: string
    type: object
host: localhost:4000
info:
  contact:
    name: 42 Transcendence
  description: |-
    ユーザー・認証・フレンド・ブロック・アバターを扱う公開 API の仕様。
    外部クライアントから叩けるよう、認証は Cookie ではなく Bearer トークンで行う。
    現時点では仕様のみで、エンドポイントの実装はこれから追加される。
  license:
    name: MIT
  title: ft_transcendence API
  version: "1.0"
paths:
  /achievements/me:
    get:
      description: 解除済み・未解除をまとめて返す。未解除のものには現在の進捗が入る。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apispec.AchievementListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 自分の実績
      tags:
      - achievements
  /apikeys:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apispec.APIKeyListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      summary: API キー一覧
      tags:
      - apikeys
    post:
      consumes:
      - application/json
      description: raw key はこのレスポンスで一度だけ返す。DB にはハッシュしか保存しない。
      parameters:
      - description: 作成内容
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apispec.APIKeyCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/apispec.APIKeyCreatedResponse'
        "400":
          description: 名前・スコープ・期限が不正
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "401":
          description: 未ログイン（管理は Cookie セッション）
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      summary: API キーを発行する
      tags:
      - apikeys
  /apikeys/{keyId}:
    delete:
      description: 行は消さず revoked_at を立てる。以後そのキーのリクエストは 401 になる。
      parameters:
      - description: キー ID
        format: uuid
        in: path
        name: keyId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "404":
          description: 自分のキーに存在しない
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      summary: API キーを失効させる
      tags:
      - apikeys
  /auth/login:
    post:
      consumes:
      - application/json
      description: 認証に成功するとセッションを 1 件作り、Bearer トークンを返す。
      parameters:
      - description: 認証情報
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/apispec.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apispec.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "401":
          description: メールまたはパスワードが違う
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "403":
          description: アカウントが停止されている
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      summary: ログイン
      tags:
      - auth
  /auth/logout:
    post:
      description: リクエストに使われたセッションを失効させる（sessions.revoked_at）。
      produces:
      - application/json
      responses:
        "204":
          description: 失効完了
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ログアウト
      tags:
      - auth
  /auth/oauth/{provider}:
    get:
      description: 'プロバイダの認可 URL を返す。Accept: text/html のブラウザからは 302 でリダイレクトする。'
      parameters:
      - description: プロバイダ
        enum:
        - google
        - github
        - "42"
        in: path
        name: provider
        required: true
        type: string
      - description: 認可後に戻すフロントエンドの URL（許可リスト内のみ）
        in: query
        name: redirect_uri
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apispec.OAuthAuthorizeResponse'
        "400":
          description: 未対応のプロバイダ
          schema:
