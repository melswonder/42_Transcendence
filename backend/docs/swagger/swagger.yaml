        in: query
        name: mode
        type: string
      - default: day
        description: 刻み幅
        enum:
        - day
        - week
        in: query
        name: interval
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apispec.TimeseriesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 自分の統計の推移
      tags:
      - stats
  /stats/stream:
    get:
      description: |-
        自分が参加した対戦が記録されるたびに 1 イベント流す。
        接続は開きっぱなしになり、切断はクライアント側が閉じるか
        サーバーが落ちるまで続く。ブラウザの EventSource は自動で再接続する。
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'data: に JSON が 1 行ずつ流れる'
          schema:
            $ref: '#/definitions/apispec.StatsUpdatedEvent'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 統計の更新通知 (SSE)
      tags:
      - stats
  /users:
    get:
      description: handle / 表示名の部分一致で検索する。退会済みとブロック関係にあるユーザーは含めない。
      parameters:
      - description: handle または表示名の部分一致
        example: mels
        in: query
        name: q
        type: string
      - description: handle の完全一致
        in: query
        name: handle
        type: string
      - default: 20
        description: 取得件数 (1-100)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: 取得開始位置
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apispec.UserListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ユーザーを検索
      tags:
      - users
  /users/{userId}:
    get:
      parameters:
      - description: ユーザー ID
        format: uuid
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apispec.UserPublic'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "404":
          description: 存在しない、または退会済み
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ユーザーの公開プロフィールを取得
      tags:
      - users
  /users/me:
    delete:
      consumes:
      - application/json
      description: users.anonymized_at を立てて個人情報を落とす。handle と email は他ユーザーが再利用できるようになる。
      parameters:
      - description: パスワードを持つユーザーは必須
        in: body
        name: body
        schema:
          $ref: '#/definitions/apispec.DeleteMeRequest'
      produces:
      - application/json
      responses:
        "204":
          description: 退会完了。全セッションが失効する
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 退会する（匿名化）
      tags:
      - users
    get:
      description: アクセストークンの持ち主のプロフィールを返す。email や連携済み OAuth プロバイダを含む。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apispec.UserPrivate'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 自分のプロフィールを取得
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: 表示名・handle・言語・アバターを部分更新する。handle は退会者を除いて一意。
      parameters:
      - description: 更新する項目だけを含める
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/apispec.UpdateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apispec.UserPrivate'
        "400":
          description: バリデーションエラー
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "409":
          description: handle が既に使われている
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 自分のプロフィールを更新
      tags:
      - users
  /v1/friends:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apispec.FriendshipListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: フレンド一覧（Public API）
      tags:
      - public
  /v1/friends/{userId}:
    delete:
      parameters:
      - description: 相手のユーザー ID
        format: uuid
        in: path
        name: userId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "404":
          description: friend_not_found
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: フレンド解除（Public API）
      tags:
      - public
  /v1/friends/requests:
    post:
      consumes:
      - application/json
      parameters:
      - description: 申請先
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apispec.FriendRequestCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/apispec.FriendshipResponse'
        "400":
          description: friend_self
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "403":
          description: insufficient_scope / friend_blocked
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "404":
          description: user_not_found
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "409":
          description: friend_already_requested / already_friends
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: フレンド申請（Public API）
      tags:
      - public
  /v1/leaderboard:
    get:
      parameters:
      - default: 20
        description: 件数
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: 開始位置
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apispec.LeaderboardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ランキング（Public API）
      tags:
      - public
  /v1/matches:
    get:
      parameters:
      - description: この日時以降（RFC3339 か YYYY-MM-DD）
        in: query
        name: from
        type: string
      - description: この日時まで
        in: query
        name: to
        type: string
      - description: モード
        enum:
        - ranked
        - casual
        - ai
        - friend
        in: query
        name: mode
        type: string
      - description: 勝敗
        enum:
        - win
        - loss
        - draw
        in: query
        name: outcome
        type: string
      - default: 20
        description: 件数
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: 開始位置
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apispec.MatchListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 対戦履歴（Public API）
      tags:
      - public
  /v1/profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apispec.UserPrivate'
        "401":
          description: invalid_api_key / api_key_expired / api_key_revoked
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "403":
          description: insufficient_scope（read が必要）
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "429":
          description: rate_limited
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 自分のプロフィール（Public API）
      tags:
      - public
    put:
      consumes:
      - application/json
      parameters:
      - description: 変更内容
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apispec.PublicProfileUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apispec.UserPrivate'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "403":
          description: insufficient_scope（write が必要）
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "409":
          description: handle_taken
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "429":
          description: rate_limited
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: プロフィール編集（Public API）
      tags:
      - public
  /v1/stats:
    get:
      parameters:
      - description: この日時以降
        in: query
        name: from
        type: string
      - description: この日時まで
        in: query
        name: to
        type: string
      - description: モード
        enum:
        - ranked
        - casual
        - ai
        - friend
        in: query
        name: mode
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apispec.StatsSummary'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apispec.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 統計サマリー（Public API）
      tags:
      - public
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: '`Bearer {access_token}` 形式で指定する。トークンは POST /auth/login などで発行する。'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
