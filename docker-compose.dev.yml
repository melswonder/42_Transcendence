# frontend をホットリロードの dev サーバーに差し替える。
#   make build-dev && make up-dev
# 既定（make up）は本番ビルド。dev サーバーは Fast Refresh などをブラウザの
# コンソールに出すので、コンソールを検査するときは使わない。
services:
  frontend:
    # 本番ビルドのイメージを上書きしないよう別タグにする。
    image: transcendence-frontend-dev
    build:
      dockerfile: Dockerfile
    # ソースを覗かせてホットリロードを効かせる。node_modules と .next は
    # コンテナ側を使うため匿名ボリュームで隠す。
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      # 初回アクセスの Turbopack コンパイルを起動時に済ませる。
      start_period: 120s
